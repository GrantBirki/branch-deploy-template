name: branch deploy

on:
  issue_comment:
    types: [created]

permissions: {}

# Cache mode: none. Candidate content is never passed to a privileged job through a cache or artifact.
jobs:
  admit:
    if: >-
      ${{
        github.event.issue.pull_request &&
        (startsWith(github.event.comment.body, '.deploy') ||
         startsWith(github.event.comment.body, '.noop') ||
         startsWith(github.event.comment.body, '.lock') ||
         startsWith(github.event.comment.body, '.unlock') ||
         startsWith(github.event.comment.body, '.wcid') ||
         startsWith(github.event.comment.body, '.help'))
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      checks: read
      contents: write
      deployments: write
      pull-requests: write
      statuses: read
    outputs:
      context: ${{ steps.branch-deploy.outputs.context }}
      continue: ${{ steps.branch-deploy.outputs.continue }}
      noop: ${{ steps.branch-deploy.outputs.noop }}
      sha: ${{ steps.branch-deploy.outputs.sha }}
    steps:
      - name: Admit Branch Deploy command
        id: branch-deploy
        uses: GrantBirki/branch-deploy@a7a7ea40a15a79a036322c2924ab74f5eded702c # v12.1.0
        with:
          allow_forks: false
          checks: all
          commit_verification: true
          deployment_confirmation: true
          deployment_confirmation_timeout: 300
          environment: test
          environment_targets: test
          permissions: write,admin
          production_environments: ''
          skip_completing: true
          stable_branch: ${{ github.event.repository.default_branch }}

  terraform:
    needs: admit
    if: >-
      ${{
        needs.admit.outputs.continue == 'true' &&
        fromJSON(needs.admit.outputs.context).run_attempt == github.run_attempt
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Validate admitted revision
        id: revision
        env:
          ADMITTED_SHA: ${{ needs.admit.outputs.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$ADMITTED_SHA" =~ ^[0-9a-f]{40}([0-9a-f]{24})?$ ]]; then
            echo "Branch Deploy did not return an exact Git SHA" >&2
            exit 1
          fi
          printf 'sha=%s\n' "$ADMITTED_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout admitted revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ steps.revision.outputs.sha }}

      - name: Verify checkout
        env:
          ADMITTED_SHA: ${{ steps.revision.outputs.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [[ "$actual_sha" != "$ADMITTED_SHA" ]]; then
            echo "checked out $actual_sha instead of $ADMITTED_SHA" >&2
            exit 1
          fi

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false

      - name: Run candidate Terraform
        env:
          DEPLOYMENT_SHA: ${{ steps.revision.outputs.sha }}
          NOOP: ${{ needs.admit.outputs.noop }}
        run: |
          set -euo pipefail
          case "$NOOP" in
            true) exec script/noop ;;
            false) exec script/deploy ;;
            *) echo "Branch Deploy returned an invalid noop value" >&2; exit 1 ;;
          esac

  complete:
    needs: [admit, terraform]
    if: ${{ always() && needs.admit.outputs.continue == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      deployments: write
      pull-requests: write
    steps:
      - name: Report Branch Deploy result
        uses: GrantBirki/branch-deploy@a7a7ea40a15a79a036322c2924ab74f5eded702c # v12.1.0
        with:
          context: ${{ needs.admit.outputs.context }}
          job_results: ${{ toJSON(needs.*.result) }}
          result_mode: true
