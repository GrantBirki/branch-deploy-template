name: branch-deploy

on:
  issue_comment:
    types: [created]

permissions: {}

# Cache mode: none. Only validated resource-action summaries reach the reporting job.
jobs:
  branch-deploy:
    name: branch-deploy
    # author_association describes the commenter, not the PR source. Branch Deploy still rejects forks.
    if: >-
      ${{
        github.event.issue.pull_request &&
        contains(fromJSON('["OWNER", "MEMBER"]'), github.event.comment.author_association) &&
        (startsWith(github.event.comment.body, '.deploy') ||
         startsWith(github.event.comment.body, '.noop') ||
         startsWith(github.event.comment.body, '.lock') ||
         startsWith(github.event.comment.body, '.unlock') ||
         startsWith(github.event.comment.body, '.wcid') ||
         startsWith(github.event.comment.body, '.help'))
      }}
    runs-on: ubuntu-latest
    permissions:
      checks: read
      contents: write
      deployments: write
      pull-requests: write
      statuses: read
    outputs:
      context: ${{ steps.branch-deploy.outputs.context }}
      continue: ${{ steps.branch-deploy.outputs.continue }}
      noop: ${{ steps.branch-deploy.outputs.noop }}
      pr_number: ${{ steps.branch-deploy.outputs.issue_number }}
      ref: ${{ steps.branch-deploy.outputs.ref }}
      sha_deployment: ${{ steps.branch-deploy.outputs.sha_deployment }}
      sha: ${{ steps.branch-deploy.outputs.sha }}
    steps:
      - name: branch-deploy
        id: branch-deploy
        uses: GrantBirki/branch-deploy@9a6ed7fac18108babd7fdc3903d3d8f0a5ad8d66  # v12.1.1
        with:
          sticky_locks: "true"
          admins: "GrantBirki"
          allow_forks: "false"
          deployment_confirmation: "false"
          commit_verification: true
          environment_targets: production
          skip_completing: true

  deploy:
    name: deploy
    outputs:
      summary: ${{ needs.branch-deploy.outputs.noop == 'true' && steps.plan.outputs.summary || steps.apply.outputs.summary }}
    needs: branch-deploy
    if: >-
      ${{
        needs.branch-deploy.outputs.continue == 'true' &&
        fromJSON(needs.branch-deploy.outputs.context).run_attempt == github.run_attempt
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: validate revision
        id: revision
        env:
          DEPLOYMENT_SHA: ${{ needs.branch-deploy.outputs.sha }}
          NOOP: ${{ needs.branch-deploy.outputs.noop }}
        run: |
          set -euo pipefail
          if [[ ! "$DEPLOYMENT_SHA" =~ ^[0-9a-f]{40}([0-9a-f]{24})?$ ]]; then
            echo "Branch Deploy did not return an exact Git SHA" >&2
            exit 1
          fi
          [[ "$NOOP" == "true" || "$NOOP" == "false" ]] || exit 1
          printf 'sha=%s\n' "$DEPLOYMENT_SHA" >> "$GITHUB_OUTPUT"

      - name: checkout trusted tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: trusted

      - name: checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ steps.revision.outputs.sha }}
          path: source

      - name: verify checkouts
        env:
          DEPLOYMENT_SHA: ${{ steps.revision.outputs.sha }}
          TRUSTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ -d trusted && ! -L trusted && -d source && ! -L source ]]
          [[ "$(git -C trusted rev-parse HEAD)" == "$TRUSTED_SHA" ]]
          [[ "$(git -C source rev-parse HEAD)" == "$DEPLOYMENT_SHA" ]]

      - name: setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: trusted/.node-version
          package-manager-cache: false

      - name: terraform version
        id: version
        run: trusted/script/terraform-version

      - name: setup terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_version: ${{ steps.version.outputs.version }}
          terraform_wrapper: false

      - name: terraform plan
        id: plan
        if: ${{ needs.branch-deploy.outputs.noop == 'true' }}
        env:
          CAPTURE_TERRAFORM_SUMMARY: true
          TERRAFORM_ROOT: ${{ github.workspace }}/source
          DEPLOYMENT_SHA: ${{ steps.revision.outputs.sha }}
        run: trusted/script/noop

      - name: terraform apply
        id: apply
        if: ${{ needs.branch-deploy.outputs.noop == 'false' }}
        env:
          CAPTURE_TERRAFORM_SUMMARY: true
          TERRAFORM_ROOT: ${{ github.workspace }}/source
          DEPLOYMENT_SHA: ${{ steps.revision.outputs.sha }}
        run: trusted/script/deploy

  deployment-message:
    name: deployment-message
    needs: [branch-deploy, deploy]
    if: >-
      ${{
        always() && needs.branch-deploy.outputs.continue == 'true' &&
        fromJSON(needs.branch-deploy.outputs.context).run_attempt == github.run_attempt
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      message: ${{ steps.render.outputs.DEPLOY_MESSAGE }}
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: verify checkout
        env:
          TRUSTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$TRUSTED_SHA" ]]

      - name: setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: render message
        id: render
        env:
          DEPLOYMENT_SHA: ${{ needs.branch-deploy.outputs.sha }}
          SUMMARY_MODE: ${{ needs.branch-deploy.outputs.noop == 'true' && 'noop' || 'deploy' }}
          PLAN_SUMMARY: ${{ needs.deploy.outputs.summary }}
          JOB_RESULT: ${{ needs.deploy.result }}
        run: node .github/scripts/deployment-summary.ts render

  status:
    name: status
    needs: [branch-deploy, deploy, deployment-message]
    if: ${{ always() && needs.branch-deploy.outputs.continue == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      deployments: write
      pull-requests: write
    steps:
      - name: report result
        uses: GrantBirki/branch-deploy@9a6ed7fac18108babd7fdc3903d3d8f0a5ad8d66  # v12.1.1
        env:
          DEPLOY_MESSAGE: >-
            ${{ needs.deployment-message.outputs.message || format('Terraform job result: {0}. Plan details unavailable; see workflow logs.', needs.deploy.result) }}
        with:
          context: ${{ needs.branch-deploy.outputs.context }}
          job_results: '["${{ needs.branch-deploy.result }}", "${{ needs.deploy.result }}"]'
          result_mode: true

  pr-status:
    name: pr status
    needs: [branch-deploy, deploy, status]
    if: >-
      ${{
        always() &&
        needs.branch-deploy.outputs.continue == 'true' &&
        fromJSON(needs.branch-deploy.outputs.context).run_attempt == github.run_attempt &&
        needs.branch-deploy.outputs.sha_deployment == '' &&
        needs.branch-deploy.outputs.ref != github.event.repository.default_branch
      }}
    permissions:
      contents: read
      checks: read
      statuses: read
      pull-requests: write
    uses: ./.github/workflows/pr-status.yml
    with:
      transition: ${{ needs.branch-deploy.outputs.noop == 'true' && 'noop' || 'deploy' }}
      pr_number: ${{ fromJSON(needs.branch-deploy.outputs.pr_number) }}
      expected_head_sha: ${{ needs.branch-deploy.outputs.sha }}
      operation_result: ${{ needs.deploy.result }}
