---
name: branch deploy

on:
  issue_comment:
    types: [created]

permissions: {}

# Cache mode: none. Candidate content is never passed to a privileged job through a cache or artifact.
jobs:
  branch-deploy:
    name: branch deploy
    # author_association describes the commenter, not the PR source. Branch Deploy still rejects forks.
    if: >-
      ${{
        github.event.issue.pull_request &&
        contains(fromJSON('["OWNER", "MEMBER"]'), github.event.comment.author_association) &&
        (startsWith(github.event.comment.body, '.deploy') ||
         startsWith(github.event.comment.body, '.noop') ||
         startsWith(github.event.comment.body, '.lock') ||
         startsWith(github.event.comment.body, '.unlock') ||
         startsWith(github.event.comment.body, '.wcid') ||
         startsWith(github.event.comment.body, '.help'))
      }}
    runs-on: ubuntu-latest
    permissions:
      checks: read
      contents: write
      deployments: write
      pull-requests: write
      statuses: read
    outputs:
      context: ${{ steps.branch-deploy.outputs.context }}
      continue: ${{ steps.branch-deploy.outputs.continue }}
      noop: ${{ steps.branch-deploy.outputs.noop }}
      sha: ${{ steps.branch-deploy.outputs.sha }}
      terraform_version: ${{ steps.version.outputs.version }}
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: terraform version
        id: version
        env:
          TRUSTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$TRUSTED_SHA" ]] || exit 1
          version="$(script/terraform-version)"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: branch deploy
        id: branch-deploy
        uses: GrantBirki/branch-deploy@9a6ed7fac18108babd7fdc3903d3d8f0a5ad8d66  # v12.1.1
        with:
          commit_verification: true
          deployment_confirmation: true
          environment: test
          environment_targets: test
          skip_completing: true

  terraform:
    name: terraform
    needs: branch-deploy
    if: >-
      ${{
        needs.branch-deploy.outputs.continue == 'true' &&
        fromJSON(needs.branch-deploy.outputs.context).run_attempt == github.run_attempt
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: validate revision
        id: revision
        env:
          ADMITTED_SHA: ${{ needs.branch-deploy.outputs.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$ADMITTED_SHA" =~ ^[0-9a-f]{40}([0-9a-f]{24})?$ ]]; then
            echo "Branch Deploy did not return an exact Git SHA" >&2
            exit 1
          fi
          printf 'sha=%s\n' "$ADMITTED_SHA" >> "$GITHUB_OUTPUT"

      - name: setup terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_version: ${{ needs.branch-deploy.outputs.terraform_version }}
          terraform_wrapper: false

      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ steps.revision.outputs.sha }}

      - name: verify checkout
        env:
          ADMITTED_SHA: ${{ steps.revision.outputs.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [[ "$actual_sha" != "$ADMITTED_SHA" ]]; then
            echo "checked out $actual_sha instead of $ADMITTED_SHA" >&2
            exit 1
          fi

      - name: run terraform
        env:
          DEPLOYMENT_SHA: ${{ steps.revision.outputs.sha }}
          NOOP: ${{ needs.branch-deploy.outputs.noop }}
        run: |
          set -euo pipefail
          case "$NOOP" in
            true) exec script/noop ;;
            false) exec script/deploy ;;
            *) echo "Branch Deploy returned an invalid noop value" >&2; exit 1 ;;
          esac

  status:
    name: status
    needs: [branch-deploy, terraform]
    if: ${{ always() && needs.branch-deploy.outputs.continue == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      deployments: write
      pull-requests: write
    steps:
      - name: report result
        uses: GrantBirki/branch-deploy@9a6ed7fac18108babd7fdc3903d3d8f0a5ad8d66  # v12.1.1
        with:
          context: ${{ needs.branch-deploy.outputs.context }}
          job_results: ${{ toJSON(needs.*.result) }}
          result_mode: true
