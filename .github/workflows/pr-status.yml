---
name: pr status

on:
  pull_request_target:  # zizmor: ignore[dangerous-triggers] trusted metadata only; no candidate checkout or execution
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, closed]
  pull_request_review:
    types: [submitted, dismissed]
  status:
  workflow_run:  # zizmor: ignore[dangerous-triggers] API metadata only; no artifacts or candidate execution
    workflows: [lint, test, acceptance]
    types: [completed]

permissions: {}

jobs:
  resolve:
    name: resolve
    if: >-
      ${{
        github.event_name != 'pull_request_review' ||
        github.event.pull_request.head.repo.full_name == github.repository
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pulls: ${{ steps.pulls.outputs.pulls }}
    steps:
      - name: find pull requests
        id: pulls
        uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71  # v9.0.0
        with:
          script: |
            const numbers = new Set();
            const add = (value) => {
              const number = Number(value);
              if (Number.isSafeInteger(number) && number > 0) numbers.add(number);
            };
            add(context.payload.pull_request?.number);
            for (const pull of context.payload.workflow_run?.pull_requests || []) add(pull.number);
            if (context.eventName === "status") {
              const pulls = await github.paginate(github.rest.repos.listPullRequestsAssociatedWithCommit, {
                ...context.repo, commit_sha: context.payload.sha, per_page: 100
              });
              for (const pull of pulls) add(pull.number);
            }
            core.setOutput("pulls", [...numbers]);

  pr-status:
    name: pr status (${{ matrix.pull }})
    needs: resolve
    if: ${{ needs.resolve.outputs.pulls != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pull: ${{ fromJSON(needs.resolve.outputs.pulls) }}
    permissions:
      checks: read
      contents: read
      pull-requests: write
      statuses: read
    steps:
      - name: current pull request
        id: pull
        uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71  # v9.0.0
        env:
          PULL_REQUEST: ${{ matrix.pull }}
        with:
          script: |
            let pull;
            try {
              ({data: pull} = await github.rest.pulls.get({
                ...context.repo, pull_number: Number(process.env.PULL_REQUEST)
              }));
            } catch (error) {
              if (error.status === 404) return;
              throw error;
            }
            if (pull.head.repo?.full_name !== context.payload.repository.full_name) return;
            core.setOutput("head", pull.head.sha);
            core.setOutput("open", pull.state === "open");

      - name: evaluate status
        id: status
        if: ${{ steps.pull.outputs.open == 'true' }}
        uses: GrantBirki/pr-status@90636f5a04ca4a039bfae198f9bf74996fa636df  # v3.0.0
        with:
          pr_number: ${{ matrix.pull }}
          evaluations: approved,min_approvals=1,not_draft,ci_passing
          workflow: pr status (${{ matrix.pull }})
          pass_labels: 'deploy: ready'
          fail_labels: 'deploy: needs attention'

      - name: clear stale labels
        if: ${{ always() && steps.pull.outputs.head != '' }}
        uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71  # v9.0.0
        env:
          PULL_REQUEST: ${{ matrix.pull }}
          EXPECTED_HEAD: ${{ steps.pull.outputs.head }}
          STATUS_OUTCOME: ${{ steps.status.outcome }}
        with:
          script: |
            const number = Number(process.env.PULL_REQUEST);
            let pull;
            try {
              ({data: pull} = await github.rest.pulls.get({...context.repo, pull_number: number}));
            } catch (error) {
              if (error.status === 404) return;
              throw error;
            }
            if (process.env.STATUS_OUTCOME === "success" && pull.state === "open" &&
                pull.head.sha === process.env.EXPECTED_HEAD &&
                pull.head.repo?.full_name === context.payload.repository.full_name) return;
            for (const label of pull.labels) {
              const name = typeof label === "string" ? label : label.name;
              if (["deploy: ready", "deploy: needs attention"].includes(name)) {
                await github.rest.issues.removeLabel({...context.repo, issue_number: number, name});
              }
            }
