---
name: deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

# Cache mode: none. The local state lifecycle is isolated to this job.
jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    concurrency:
      group: deployment-test
      cancel-in-progress: false
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: verify checkout
        env:
          DEPLOYMENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$DEPLOYMENT_SHA" =~ ^[0-9a-f]{40}([0-9a-f]{24})?$ ]]
          [[ "$(git rev-parse HEAD)" == "$DEPLOYMENT_SHA" ]]

      - name: terraform version
        id: version
        run: printf 'version=%s\n' "$(script/terraform-version)" >> "$GITHUB_OUTPUT"

      - name: setup terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_version: ${{ steps.version.outputs.version }}
          terraform_wrapper: false

      - name: deploy
        env:
          DEPLOYMENT_SHA: ${{ github.sha }}
        run: script/deploy
