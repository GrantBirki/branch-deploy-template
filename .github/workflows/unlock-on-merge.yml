name: unlock on merge

cache-mode: none

on:
  pull_request:
    types: [closed]

permissions: {}

jobs:
  unlock-on-merge:
    name: unlock on merge
    if: ${{ github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: unlock on merge
        uses: GrantBirki/branch-deploy@a589e8d69ed275ec1e1dbfa8de6e3429f077b08b  # v12.4.3
        with:
          environment_targets: production
          unlock_on_merge_mode: true
