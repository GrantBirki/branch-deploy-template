name: unlock on merge

cache-mode: none

on:
  pull_request:
    types: [closed]

permissions: {}

jobs:
  unlock-on-merge:
    name: unlock on merge
    if: ${{ github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: unlock on merge
        uses: GrantBirki/branch-deploy@7173dcbb72a30da0148076fade87260ddd1b5e28  # v12.4.2
        with:
          environment_targets: production
          unlock_on_merge_mode: true
