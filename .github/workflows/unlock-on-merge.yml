name: unlock on merge

cache-mode: none

on:
  pull_request:
    types: [closed]

permissions: {}

jobs:
  unlock-on-merge:
    name: unlock on merge
    if: ${{ github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: unlock on merge
        uses: GrantBirki/branch-deploy@10ee06ba892042c082c9bd5abacdd9b5f4a6efbd  # v12.4.0
        with:
          environment_targets: production
          unlock_on_merge_mode: true
