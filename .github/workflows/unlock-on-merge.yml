name: unlock on merge

cache-mode: none

on:
  pull_request:
    types: [closed]

permissions: {}

jobs:
  unlock-on-merge:
    name: unlock on merge
    if: ${{ github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: unlock on merge
        uses: GrantBirki/branch-deploy@18049b1a468b9a0220663f56017d2ba309d08e6b  # v12.3.0
        with:
          environment_targets: production
          unlock_on_merge_mode: true
