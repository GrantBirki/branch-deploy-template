---
name: new pull request

on:
  pull_request_target:  # zizmor: ignore[dangerous-triggers] trusted metadata only; no candidate checkout or execution
    branches: [main]
    types: [opened]

permissions: {}

jobs:
  new-pr:
    name: new pull request
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: deployment instructions
        uses: GrantBirki/comment@937820f3623fd0e300294bcc64ac7577fc0ad4cc  # v3.0.3
        with:
          body: |
            ### branch deploy

            Run `.noop test` after CI passes and inspect its result before deploying. Status labels summarize reviews and CI; they do not record noop or deployment completion.

            Run `.deploy test` only when you intend to exercise the disposable local-state apply flow. Branch Deploy enforces authorization, reviews, checks, confirmation, fork denial, and the exact commit.
